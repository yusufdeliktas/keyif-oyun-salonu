plugins {
    id 'com.android.application'
}

android {
    namespace 'com.keyif.oyunsalonu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.keyif.oyunsalonu'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // İmza bilgileri GitHub'a yüklenmeyen keystore.properties dosyasından okunur
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Oyunlar ../../web klasöründen derleme sırasında kopyalanır
    sourceSets {
        main {
            assets.srcDirs = ["$buildDir/generated/webassets"]
        }
    }
}

tasks.register('copyWeb', Copy) {
    from "${rootDir}/../web"
    into "$buildDir/generated/webassets/web"
}
preBuild.dependsOn copyWeb
