<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<title>Keyif Oyun Salonu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keyif">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- ANA MENÜ -->
  <section id="home" class="screen active">
    <div class="wrap">
      <header class="hero">
        <div class="brand">
          <div class="logo">
            <svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#00d4ff"/></linearGradient></defs><rect x="4" y="14" width="56" height="36" rx="18" fill="url(#lg)"/><rect x="14" y="29" width="14" height="5" rx="2" fill="#fff"/><rect x="18.5" y="24.5" width="5" height="14" rx="2" fill="#fff"/><circle cx="43" cy="27" r="4" fill="#fff"/><circle cx="50" cy="35" r="4" fill="#ffffffaa"/></svg>
          </div>
          <div>
            <h1>KEYİF</h1>
            <p>Oyun Salonu</p>
          </div>
        </div>
        <div class="hero-actions">
          <button id="btnRandom" class="icon-btn" title="Rastgele oyun" aria-label="Rastgele oyun"></button>
          <button id="btnSettings" class="icon-btn" title="Ayarlar" aria-label="Ayarlar"></button>
        </div>
      </header>

      <div id="continue"></div>

      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Oyun ara..." autocomplete="off">
      </div>

      <nav class="tabs" id="tabs">
        <button data-tab="all" class="on">Tümü</button>
        <button data-tab="retro">Eski Nesil</button>
        <button data-tab="modern">Yeni Nesil</button>
        <button data-tab="fav">Favoriler</button>
      </nav>

      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden"></div>

      <footer class="foot">
        <span id="footInfo"></span>
      </footer>
    </div>
  </section>

  <!-- OYUN EKRANI -->
  <section id="play" class="screen">
    <div class="topbar">
      <button id="btnBack" class="icon-btn" aria-label="Geri"></button>
      <div class="tb-title" id="gTitle"></div>
      <div class="tb-scores">
        <div class="sbox" id="boxScore"><small id="gScoreLbl">SKOR</small><b id="gScore">0</b></div>
        <div class="sbox" id="boxBest"><small id="gBestLbl">EN İYİ</small><b id="gBest">0</b></div>
      </div>
      <button id="btnHelp" class="icon-btn" aria-label="Yardım"></button>
      <button id="btnPause" class="icon-btn" aria-label="Duraklat"></button>
    </div>
    <div id="stage"></div>
    <div id="overlay" class="overlay hidden"><div class="panel" id="panel"></div></div>
  </section>

  <div id="modal" class="overlay hidden"><div class="panel" id="mpanel"></div></div>
  <div id="toast"></div>
</div>

<script src="js/core.js"></script>
<script src="games/snake.js"></script>
<script src="games/blocks.js"></script>
<script src="games/breakout.js"></script>
<script src="games/shooter.js"></script>
<script src="games/mines.js"></script>
<script src="games/pong.js"></script>
<script src="games/chess.js"></script>
<script src="games/dama.js"></script>
<script src="games/solitaire.js"></script>
<script src="games/connect4.js"></script>
<script src="games/merge.js"></script>
<script src="games/blockpuzzle.js"></script>
<script src="games/bee.js"></script>
<script src="games/runner.js"></script>
<script src="games/bubble.js"></script>
<script src="games/sudoku.js"></script>
<script src="games/memory.js"></script>
</body>
</html>
