<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Zindan Kaşifi - Sanat Önizleme</title>
<style>
  body { background: #15121c; color: #d5dae2; font: 12px/1.3 system-ui, sans-serif; margin: 12px; }
  h2 { font-size: 15px; margin: 18px 0 8px; color: #ffd23f; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .cell { background: #2b2536; border: 1px solid #3d3550; border-radius: 4px; padding: 4px; text-align: center; }
  .cell canvas { display: block; margin: 0 auto 2px; image-rendering: pixelated; }
  .cell span { font-size: 10px; color: #aab; }
  #info { color: #8fd; }
</style>
</head>
<body>
<h1 style="font-size:18px">Zindan Kaşifi — Sanat Önizleme</h1>
<div id="info"></div>
<div id="root"></div>
<script src="../web/games/dungeon/art.js"></script>
<script>
(function () {
  'use strict';
  var A = window.DG.art;
  var T = { WALL: 0, FLOOR: 1, DOOR: 2, DOOR_OPEN: 3, STAIRS: 4, STAIRS_UP: 5, WATER: 6, LAVA: 7, CHASM: 8 };
  var t0 = performance.now();
  A.init();
  var initMs = performance.now() - t0;
  window.__artInitMs = initMs;
  var root = document.getElementById('root');
  var all = A.ids();
  document.getElementById('info').textContent = 'Sprite sayısı: ' + all.length + ' · init: ' + initMs.toFixed(2) + ' ms';

  function section(title) {
    var h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
    var d = document.createElement('div'); d.className = 'grid'; root.appendChild(d);
    return d;
  }
  function canvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function cell(parent, c, label) {
    var d = document.createElement('div'); d.className = 'cell';
    d.appendChild(c);
    var s = document.createElement('span'); s.textContent = label; d.appendChild(s);
    parent.appendChild(d);
  }
  // Bir sprite: 2x (kare 0,1) + 4x (kare 0,1), zemin rengi üstünde
  function spriteCell(parent, id) {
    var m = A.big(id) ? 2 : 1;
    var s2 = 32, s4 = 64;
    var w = (s2 * 2 + s4 * 2) * m + 12, h = s4 * m;
    var c = canvas(w, h), g = c.getContext('2d');
    g.fillStyle = '#4a3426'; g.fillRect(0, 0, w, h);
    var x = 0;
    [[s2, 0], [s2, 1], [s4, 0], [s4, 1]].forEach(function (p) {
      var sz = p[0], ox = x, oy = h - sz * m;
      if (m === 2) { ox += sz / 2; oy += sz; }
      A.draw(g, id, ox, oy, sz, { frame: p[1] });
      x += sz * m + 4;
    });
    cell(parent, c, id);
  }

  var groups = [
    ['Kahramanlar + NPC', ['savasci', 'okcu', 'buyucu', 'tuccar']],
    ['Mahzen', ['sican', 'yarasa', 'balcik', 'goblin', 'iskelet']],
    ['Mağara', ['orumcek', 'goblin_okcu', 'ork', 'saman', 'kurt']],
    ['Mezar', ['zombi', 'hayalet', 'iskelet_buyucu', 'gulyabani', 'tarikatci']],
    ['Lav', ['ates_cini', 'semender', 'golem', 'alev_buyucu', 'cehennem_kopegi']],
    ['Buz', ['buz_trolu', 'ruh', 'kara_sovalye', 'minotor', 'ejder_yavrusu']],
    ['Bosslar', ['goblin_kral', 'lich', 'ejderha']]
  ];
  var shown = {};
  groups.forEach(function (gr) {
    var d = section(gr[0]);
    gr[1].forEach(function (id) { shown[id] = 1; spriteCell(d, id); });
  });
  var rest = section('Eşyalar, karolar, dekor (kalan tüm ID\'ler)');
  all.forEach(function (id) { if (!shown[id]) spriteCell(rest, id); });

  // Tema örnek odaları (6x4)
  var rooms = section('Tema odaları (6×4, 32px ve 48px)');
  var MAP = [
    [0, 0, 2, 0, 0, 0],
    [0, 1, 1, 1, 5, 0],
    [3, 1, 6, 7, 4, 0],
    [0, 1, 1, 1, 8, 0]
  ];
  A.themes.forEach(function (th) {
    [32, 48].forEach(function (sz) {
      var c = canvas(6 * sz, 4 * sz), g = c.getContext('2d');
      for (var y = 0; y < 4; y++) for (var x = 0; x < 6; x++) A.tile(g, th, MAP[y][x], x * sz, y * sz, sz, x * 7 + y * 13);
      if (sz === 48) {
        A.draw(g, 'savasci', 1 * sz, 1 * sz, sz);
        A.draw(g, 'goblin', 3 * sz, 3 * sz, sz, { flip: true });
        A.draw(g, 'sandik', 1 * sz, 3 * sz, sz);
        A.draw(g, 'mesale', 3 * sz, 0, sz);
      }
      cell(rooms, c, th + ' ' + sz + 'px');
    });
  });

  // Geniş zemin + duvar dokusu (çeşitlilik kontrolü)
  var wide = section('Zemin çeşitliliği + dekor (10×5, 32px)');
  A.themes.forEach(function (th) {
    var sz = 32, c = canvas(10 * sz, 5 * sz), g = c.getContext('2d');
    for (var y = 0; y < 5; y++) for (var x = 0; x < 10; x++) A.tile(g, th, (y === 0 || x === 0 || x === 9) ? T.WALL : T.FLOOR, x * sz, y * sz, sz, x * 7 + y * 13);
    ['ot', 'kemik', 'fici', 'kristal', 'sunak', 'sandik_kirik', 'tuzak', 'tuzak_gizli'].forEach(function (id, i) { A.draw(g, id, (1 + i) * sz, 2 * sz, sz); });
    cell(wide, c, th);
  });

  // Tint / outline / flip / alpha
  var fx = section('Efektler: normal, flip, tint beyaz, tint kırmızı, tint mavi, outline sarı, outline+flip, alpha 0.5, outline+tint');
  ['savasci', 'goblin', 'hayalet', 'balcik', 'iskelet', 'goblin_kral'].forEach(function (id) {
    var m = A.big(id) ? 2 : 1, sz = 48;
    var list = [{}, { flip: true }, { tint: '#ffffff' }, { tint: '#ff3b3b' }, { tint: '#6ec6ff' }, { outline: '#ffd23f' }, { outline: '#ff3b3b', flip: true }, { alpha: 0.5 }, { outline: '#ffffff', tint: '#6ec6ff' }];
    var c = canvas(list.length * (sz * m + 6), sz * m + 6), g = c.getContext('2d');
    g.fillStyle = '#4a3426'; g.fillRect(0, 0, c.width, c.height);
    list.forEach(function (o, i) {
      var ox = 3 + i * (sz * m + 6), oy = 3;
      if (m === 2) { ox += sz / 2; oy += sz; }
      A.draw(g, id, ox, oy, sz, o);
    });
    cell(fx, c, id);
  });

  // icon() ve iconUrl()
  var ic = section('icon(id, 24/40) ve iconUrl(id, 40)');
  ['kilic', 'iksir_kirmizi', 'altin', 'plaka_zirh', 'ejderha', 'yok_boyle_id'].forEach(function (id) {
    var d = document.createElement('div'); d.className = 'cell';
    d.appendChild(A.icon(id, 24)); d.appendChild(A.icon(id, 40));
    var im = document.createElement('img'); im.width = 40; im.height = 40; im.style.imageRendering = 'pixelated';
    var u = A.iconUrl(id, 40); if (u) im.src = u;
    d.appendChild(im);
    var s = document.createElement('span'); s.textContent = id; d.appendChild(s);
    ic.appendChild(d);
  });

  // Bilinmeyen ID sessizce geçilmeli
  var tc = canvas(8, 8);
  A.draw(tc.getContext('2d'), 'yok_boyle_id', 0, 0, 8, { tint: '#fff', outline: '#000' });
  A.tile(tc.getContext('2d'), 'yok_tema', 99, 0, 0, 8, -5);
})();
</script>
</body>
</html>
